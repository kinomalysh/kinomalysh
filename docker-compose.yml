services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kidsstory
      POSTGRES_PASSWORD: kidsstory
      POSTGRES_DB: kidsstory
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
